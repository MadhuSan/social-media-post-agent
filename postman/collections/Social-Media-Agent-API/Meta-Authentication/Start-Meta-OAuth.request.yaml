$kind: http-request
name: Start Meta OAuth
method: GET
url: '{{baseUrl}}/auth/meta/login?user_id={{userId}}'
order: 1000
queryParams:
  - key: user_id
    value: '{{userId}}'
    description: UUID of the user to authenticate
settings:
  followRedirects: false
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Extract the OAuth state generated by the server from the redirect Location header.
      // The server returns 302 → https://www.facebook.com/...?state=<value>&...
      // We capture that state so the "Meta OAuth Callback" request can use {{oauthState}}.
      const location = pm.response.headers.get('Location');
      if (!location) {
          console.error('No Location header found — expected a 302 redirect from /auth/meta/login');
      } else {
          try {
              const redirectUrl = new URL(location);
              const state = redirectUrl.searchParams.get('state');
              if (state) {
                  pm.collectionVariables.set('oauthState', state);
                  console.log('OAuth state captured and saved to oauthState:', state);
                  console.log('Open this URL in a browser to complete Meta login:', location);
              } else {
                  console.error('state param not found in redirect URL:', location);
              }
          } catch (e) {
              console.error('Failed to parse Location header:', e.message);
          }
      }
